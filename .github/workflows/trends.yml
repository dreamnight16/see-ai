name: Weekly AI Trends

# 每周一早上跑一次，把 AI 圈这周反复出现的说法收集起来，提交回仓库。
# 只收集"候选词 + 出处"，不写解释——名词表里的解释一律由人写。
on:
  schedule:
    # 周一 01:17 UTC（北京时间 09:17）。避开整点，减少排队。
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/trends/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/trends/requirements.txt
          pip install pytest

      - name: Run crawler tests
        run: python -m pytest scripts/trends -q

      - name: Crawl
        run: python scripts/trends/crawl.py

      - name: Commit the report
        run: |
          git config user.name "trends-bot"
          git config user.email "bot@dreamnight.net.cn"
          git add data/trends
          if git diff --staged --quiet; then
            echo "这周没有变化，不提交"
          else
            WEEK=$(date +%Y-W%V)
            git commit -m "chore(trends): update weekly AI trends $WEEK"
            git push
          fi
