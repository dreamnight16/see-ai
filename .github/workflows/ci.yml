name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  # 热词爬虫是 Python 写的，跟上面那个任务分开跑。
  # 这里只跑纯函数测试，不联网——真正的抓取在 trends.yml 里每周一次。
  trends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 必须装完整依赖：测试会 import sources，而 sources 依赖 httpx 和
      # chinese-scraper-utils。只装 pytest 的话会在收集阶段就 ImportError。
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/trends/requirements.txt
          pip install pytest
      - name: Test the trends crawler
        run: python -m pytest scripts/trends -q
